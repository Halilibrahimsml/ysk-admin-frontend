<div style="display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #f4f7f6;">
  
  <!-- ========================================================= -->
  <!-- GİRİŞ YAP FORMU (sifremiUnuttumModu false ise görünür) -->
  <!-- ========================================================= -->
  <div *ngIf="!sifremiUnuttumModu" style="background: white; padding: 40px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center;">
    
    <h2 style="margin-bottom: 25px; color: #2c3e50; font-weight: bold;">Sisteme Giriş</h2>
    
    <!-- Kullanıcı adı kutusuna Enter özelliği eklendi -->
    <input type="text" [(ngModel)]="kullaniciAdi" (keyup.enter)="girisYap()" placeholder="Kullanıcı Adı/Öğrenci No" 
           style="width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;">
    
    <!-- Şifre kutusuna Enter özelliği eklendi -->
    <input type="password" [(ngModel)]="sifre" (keyup.enter)="girisYap()" placeholder="Şifre" 
           style="width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;">
           
    <!-- ========================================================= -->
    <!-- GÜVENLİK DOĞRULAMASI (YENİ EKLENEN) -->
    <!-- ========================================================= -->
    <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 25px; background-color: #f8f9fa; padding: 10px 15px; border: 1px solid #ced4da; border-radius: 4px;">
      <div style="font-weight: bold; color: #495057; font-size: 15px;">
        🤖 Doğrulama: {{ sayi1 }} + {{ sayi2 }} = ?
      </div>
      <input type="number" [(ngModel)]="guvenlikCevabi" (keyup.enter)="girisYap()" placeholder="Cevap"
             style="width: 80px; padding: 8px; border: 1px solid #ced4da; border-radius: 4px; box-sizing: border-box; text-align: center; font-weight: bold;">
    </div>
    
    <button (click)="girisYap()" 
            style="width: 100%; padding: 12px; background-color: #2c3e50; color: white; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; transition: background 0.3s;">
      Giriş Yap
    </button>

    <!-- Şifremi Unuttum Butonu -->
    <div style="text-align: center; margin-top: 20px;">
      <a href="javascript:void(0)" (click)="sifremiUnuttumModu = true" style="color: #3498db; text-decoration: none; font-size: 14px; font-weight: bold;">Şifremi Unuttum</a>
    </div>

  </div>

  <!-- ========================================================= -->
  <!-- ŞİFRE YENİLEME FORMU (sifremiUnuttumModu true ise görünür) -->
  <!-- ========================================================= -->
  <div *ngIf="sifremiUnuttumModu" style="background: white; padding: 40px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center;">
    
    <h2 style="margin-bottom: 15px; color: #2c3e50; font-weight: bold;">Şifre Yenileme</h2>
    <p style="font-size: 13px; color: #7f8c8d; text-align: center; margin-bottom: 25px;">
      Güvenlik doğrulaması için sistemde kayıtlı bilgilerinizi giriniz.
    </p>
    
    <input type="text" [(ngModel)]="resetData.ogrenciNo" placeholder="Öğrenci Numarası" 
           style="width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;">
    
    <input type="password" [(ngModel)]="resetData.yeniSifre" placeholder="Yeni Şifre Belirleyin" 
           style="width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;">

    <input type="password" [(ngModel)]="resetData.yeniSifreTekrar" placeholder="Yeni Şifre (Tekrar)" 
           style="width: 100%; padding: 12px; margin-bottom: 25px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;">

    <button (click)="sifreSifirla()" 
            style="width: 100%; padding: 12px; background-color: #27ae60; color: white; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; transition: background 0.3s; margin-bottom: 15px;">
      Şifreyi Güncelle
    </button>
    
    <!-- Geri Dön Butonu -->
    <div style="text-align: center;">
      <a href="javascript:void(0)" (click)="sifremiUnuttumModu = false" style="color: #7f8c8d; text-decoration: none; font-size: 14px; font-weight: bold;">⬅️ Giriş Ekranına Dön</a>
    </div>
    
  </div>

  <!-- ========================================================= -->
  <!-- YANDAN KAYARAK GELEN TOAST BİLDİRİMİ (Garantili Versiyon) -->
  <!-- ========================================================= -->
  <div style="position: fixed; top: 20px; padding: 15px 25px; border-radius: 5px; color: white; font-weight: bold; box-shadow: 0 4px 8px rgba(0,0,0,0.2); z-index: 9999; transition: right 0.4s ease-in-out;"
       [style.backgroundColor]="toastTip === 'basari' ? '#27ae60' : '#e74c3c'"
       [style.right]="toastMesaj ? '20px' : '-500px'">
    {{ toastMesaj }}
  </div>

</div>
